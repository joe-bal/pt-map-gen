name: Extract Mornington Peninsula dog map

on:
  push:
    branches:
      - chatgpt/mornpen-dog-kmz
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright shapely pyproj simplekml
          playwright install --with-deps chromium
      - name: Capture IntraMaps responses and build KMZ
        run: python tools/extract_mornpen_dogs.py
      - name: Upload extraction output
        uses: actions/upload-artifact@v4
        with:
          name: mornpen-dog-map-extraction
          path: output/
          if-no-files-found: error
